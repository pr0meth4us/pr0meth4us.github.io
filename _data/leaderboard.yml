movies:
  # Sci-Fi Movies
  - title: "Interstellar"
    director: "Christopher Nolan"
    year: 2014
    rating: 9.8
    genre: "sci-fi"
    poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
    comment: "A masterpiece of visual storytelling and emotional depth. Nolan's exploration of time, love, and sacrifice through the lens of space travel is simply breathtaking."

  - title: "Doctor Strange in the Multiverse of Madness"
    director: "Sam Raimi"
    year: 2022
    rating: 9.9
    genre: "sci-fi"
    poster: "https://image.tmdb.org/t/p/w500/9Gtg2DzBhmYamXBS1hKAhiwbBKS.jpg"
    comment: "The #1 sci-fi film that perfectly blends horror elements with multiverse storytelling. Raimi's direction brings a unique dark tone to the MCU with spectacular visuals."

series:
  # Drama Series
  - title: "The Society"
    creator: "Christopher Keyser"
    year: 2019
    rating: 9.9
    genre: "drama"
    poster: "https://upload.wikimedia.org/wikipedia/en/c/c2/The_Society_%28TV_series%29_Title_Card.jpg"
    comment: "A compelling exploration of power, survival, and human nature when society's rules disappear. The young cast delivers powerful performances in this thought-provoking masterpiece."

  - title: "Mr. Sunshine"
    creator: "Kim Eun-sook"
    year: 2018
    rating: 9.5
    genre: "drama"
    poster: "https://upload.wikimedia.org/wikipedia/en/a/a5/Mr._Sunshine_%282018_TV_series%29.jpg"
    comment: "An epic historical drama with stunning cinematography and complex characters. The love story set against Korea's turbulent history is unforgettable."

  - title: "Euphoria"
    creator: "Sam Levinson"
    year: 2019
    rating: 8.4
    genre: "drama"
    poster: "https://image.tmdb.org/t/p/w500/3Q0hd3heuWwDWpwcDkhQOA6TYWI.jpg"
    comment: "Raw, honest, and visually stunning. Tackles difficult subjects with sensitivity while showcasing incredible performances, especially from Zendaya."

  # Thriller Series
  - title: "You"
    creator: "Greg Berlanti, Sera Gamble"
    year: 2018
    rating: 9.9
    genre: "thriller"
    poster: "https://upload.wikimedia.org/wikipedia/en/7/7e/You_Season_5.jpg"
    comment: "A chilling psychological thriller that explores obsession and social media culture. Penn Badgley's performance as Joe is both terrifying and captivating."

  - title: "Dark"
    creator: "Baran bo Odar, Jantje Friese"
    year: 2017
    rating: 9.7
    genre: "thriller"
    poster: "https://upload.wikimedia.org/wikipedia/en/d/da/DarkNetflixPosterEnglish.jpg"
    comment: "Mind-bending time travel thriller with incredible attention to detail. Every episode reveals new layers of complexity in this German masterpiece."

  - title: "Breaking Bad"
    creator: "Vince Gilligan"
    year: 2008
    rating: 9.9
    genre: "thriller"
    poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg"
    comment: "The ultimate character transformation story. Walter White's descent into darkness is both horrifying and compelling. Perfect storytelling."

  # Adventure Series
  - title: "Marco Polo"
    creator: "John Fusco"
    year: 2014
    rating: 8.1
    genre: "adventure"
    poster: "https://image.tmdb.org/t/p/w500/3wZPyUVmOlCHVqcWlWFVUFGH9LZ.jpg"
    comment: "Visually spectacular historical adventure with rich world-building. The portrayal of 13th-century Asia is immersive and captivating."

  # Animation Series
  - title: "Ben 10"
    creator: "Man of Action"
    year: 2005
    rating: 9.9
    genre: "animation"
    poster: "https://image.tmdb.org/t/p/w500/3vCEBhJjBTSXKfKTZ9J5lm3q3mK.jpg"
    comment: "The #1 animation series. The original Ben 10 series that started it all. Perfect blend of action, humor, and heart with creative alien transformations that captured imaginations worldwide."

  # Romance Series
  - title: "Looking for Alaska"
    creator: "Josh Schwartz"
    year: 2019
    rating: 8.2
    genre: "romance"
    poster: "https://image.tmdb.org/t/p/w500/7YjIFEO4ZPLhbQIUHlpMCCJYjz7.jpg"
    comment: "A beautiful adaptation of John Green's novel. Captures the intensity of first love and the pain of loss with remarkable authenticity."

  - title: "Nevertheless"
    creator: "Kim Ga-ram"
    year: 2021
    rating: 7.8
    genre: "romance"
    poster: "https://image.tmdb.org/t/p/w500/6O7tWkQFGpYZhQWHBhkJqHBsJGe.jpg"
    comment: "A realistic portrayal of modern relationships and the complexities of love. The chemistry between the leads is electric."

  # Comedy Series
  - title: "Cunk on Earth"
    creator: "Diane Morgan"
    year: 2022
    rating: 8.9
    genre: "comedy"
    poster: "https://image.tmdb.org/t/p/w500/4XyxpXqGzUMbVqEEsXZQTZZKgN4.jpg"
    comment: "Brilliantly absurd comedy that somehow makes you think while you laugh. Diane Morgan's deadpan delivery is pure genius."
