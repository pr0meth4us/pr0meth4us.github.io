<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOEUNG Phearaneron - Digital Adoption Coordinator</title>
    <!-- Web standards styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background-color: #050811;
            color: #f8fafc;
        }
        .khmer-font {
            font-family: 'Kantumruy Pro', 'Khmer OS', sans-serif;
        }
        /* Dynamic radial glow background */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(13, 26, 138, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(72, 200, 231, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 0%, rgba(5, 8, 17, 1) 100%);
            background-size: cover;
            z-index: 1;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 1px 1px, rgba(72, 200, 231, 0.04) 1px, transparent 0);
            background-size: 32px 32px;
            z-index: 2;
        }
        /* The giant business card container */
        .biz-card {
            background-color: rgba(14, 20, 43, 0.45);
            background-image: url('/assets/images/error_bg_image.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(72, 200, 231, 0.25);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6), 
                inset 0 0 30px rgba(72, 200, 231, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
            position: relative;
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }
        .biz-card:hover {
            box-shadow: 
                0 40px 80px rgba(72, 200, 231, 0.15), 
                inset 0 0 40px rgba(72, 200, 231, 0.25);
            border-color: rgba(72, 200, 231, 0.45);
        }
        .text-cyan {
            color: #48c8e7;
        }
        .bg-cyan-glow {
            background-color: #48c8e7;
            box-shadow: 0 0 15px rgba(72, 200, 231, 0.5);
        }
        
        /* CSS to fix MEF black background */
        .logo-mef {
            mix-blend-mode: screen;
            background: transparent !important;
        }
        
        /* Connectors for hierarchy */
        .hierarchy-line {
            width: 2px;
            height: 24px;
            background: linear-gradient(to bottom, #48c8e7, rgba(72, 200, 231, 0.1));
        }

        /* Copy popups */
        .copy-toast {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease-in-out;
        }
        .copy-toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-6 select-none relative">

    <!-- Background overlays -->
    <div class="bg-glow"></div>
    <div class="grid-overlay"></div>

    <!-- Main Giant Card -->
    <div class="biz-card w-full max-w-xl rounded-3xl p-6 md:p-9 flex flex-col justify-between overflow-hidden">
        
        <!-- Card Header: Title + Logos -->
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between border-b border-white border-opacity-10 pb-5 mb-5 gap-4">
            <!-- Left: User Identity -->
            <div class="space-y-1">
                <span class="text-[9px] md:text-[10px] tracking-widest font-bold text-cyan uppercase font-mono block mb-1">
                    // Digital Identity
                </span>
                <h1 class="khmer-font text-3xl md:text-4xl font-extrabold tracking-wide text-white leading-tight">
                    សឿង ភារ៉ានិរន្ត
                </h1>
                <h2 class="text-lg md:text-xl text-slate-300 font-light">
                    Phearaneron SOEUNG
                </h2>
                <div class="flex items-center space-x-2 mt-2.5">
                    <span class="h-2 w-2 rounded-full bg-cyan-glow"></span>
                    <span class="text-xs md:text-sm font-bold tracking-widest text-cyan uppercase font-mono">
                        Digital Adoption Coordinator
                    </span>
                </div>
            </div>
            
            <!-- Right: Logos (Horizontal Lineage) -->
            <div class="flex items-center space-x-2 bg-white bg-opacity-5 p-2 rounded-2xl border border-white border-opacity-5 self-start sm:self-auto shadow-inner">
                <!-- MEF -->
                <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center p-0.5 shadow-md">
                    <img src="/assets/images/mef.png" alt="MEF" class="h-full w-full object-contain">
                </div>
                <!-- Connector Arrow/Line -->
                <div class="w-2.5 h-[1px] bg-white opacity-20"></div>
                <!-- TSC -->
                <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center p-0.5 shadow-md">
                    <img src="/assets/images/tsc.png" alt="TSC" class="h-full w-full object-contain">
                </div>
                <!-- Connector Arrow/Line -->
                <div class="w-2.5 h-[1px] bg-white opacity-20"></div>
                <!-- EGD -->
                <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center p-1.5 shadow-md">
                    <img src="/assets/images/egd_circle.svg" alt="EGD" class="h-full w-full object-contain">
                </div>
            </div>
        </div>

        <!-- Middle Section: Official EGD Program Banner -->
        <div class="mb-5 flex flex-row items-center justify-between bg-slate-900 bg-opacity-40 p-4 rounded-2xl border border-white border-opacity-5">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center p-1.5 shadow-md">
                    <img src="/assets/images/egd_circle.svg" alt="EGD Logo" class="h-full w-full object-contain">
                </div>
                <div>
                    <div class="text-[9px] text-slate-500 font-mono uppercase tracking-wider">Official Program</div>
                    <div class="text-xs md:text-sm font-bold text-white font-sans tracking-wide">Enterprises Go Digital (EGD)</div>
                </div>
            </div>
            <div>
                <span class="text-[8px] md:text-[9px] text-cyan-400 bg-cyan-500 bg-opacity-10 border border-cyan-500 border-opacity-25 px-2.5 py-1 rounded-full font-mono uppercase tracking-wider font-semibold">
                    TSC Portal
                </span>
            </div>
        </div>

        <!-- Clean Vertical Contacts List -->
        <div class="space-y-4 mb-6 pb-5 border-b border-white border-opacity-10">
            <div class="flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-xl bg-white bg-opacity-5 flex items-center justify-center text-cyan">
                    <i class="fa-solid fa-phone text-sm"></i>
                </div>
                <div class="font-mono text-xs md:text-sm">
                    <span class="text-[9px] text-slate-500 block uppercase tracking-wider font-semibold">Mobile Phone</span>
                    <a href="tel:+855962021314" class="text-slate-300 hover:text-white hover:underline">(+855) 96 202 1314</a>
                </div>
            </div>

            <div class="flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-xl bg-white bg-opacity-5 flex items-center justify-center text-cyan">
                    <i class="fa-solid fa-envelope text-sm"></i>
                </div>
                <div class="font-mono text-xs md:text-sm">
                    <span class="text-[9px] text-slate-500 block uppercase tracking-wider font-semibold">Email Address</span>
                    <a href="mailto:phearaneron.soeung@tsc.gov.kh" class="text-slate-300 hover:text-white hover:underline">phearaneron.soeung@tsc.gov.kh</a>
                </div>
            </div>

            <div class="flex items-center space-x-3.5">
                <div class="w-9 h-9 rounded-xl bg-white bg-opacity-5 flex items-center justify-center text-cyan">
                    <i class="fa-solid fa-globe text-sm"></i>
                </div>
                <div class="font-mono text-xs md:text-sm">
                    <span class="text-[9px] text-slate-500 block uppercase tracking-wider font-semibold">Website Hub</span>
                    <a href="https://pr0meth4us.github.io/" class="text-slate-300 hover:text-white hover:underline">pr0meth4us.github.io</a>
                </div>
            </div>
        </div>

        <!-- Clean Action Buttons directly under details -->
        <div class="flex flex-col sm:flex-row gap-3 w-full">
            <button onclick="downloadVCard()" class="flex-1 flex items-center justify-center space-x-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-3.5 px-6 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 shadow-lg shadow-cyan-500/10">
                <i class="fa-solid fa-address-card text-sm"></i>
                <span>Save Contact</span>
            </button>
            <a href="https://t.me/nernnnnnnn" target="_blank" rel="noopener noreferrer" class="flex-1 flex items-center justify-center space-x-2.5 bg-white bg-opacity-10 hover:bg-opacity-20 text-white py-3.5 px-6 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 border border-white border-opacity-5">
                <i class="fa-brands fa-telegram text-sm text-cyan"></i>
                <span>Telegram</span>
            </a>
        </div>

    </div>

    <!-- Toast Popup -->
    <div id="toast" class="copy-toast fixed bottom-6 right-6 bg-cyan-500 text-slate-900 font-bold text-xs py-3.5 px-6 rounded-xl shadow-2xl flex items-center space-x-2 z-50">
        <i class="fa-solid fa-check-circle text-base"></i>
        <span>Contact VCF Card Downloaded!</span>
    </div>

    <!-- Card tilt effect scripting -->
    <script>
        const card = document.querySelector('.biz-card');
        const container = document.body;

        container.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
        });

        function downloadVCard() {
            const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:SOEUNG;Phearaneron;;;
FN:Phearaneron SOEUNG
ORG:Techo Startup Center;Ministry of Economy and Finance
TITLE:Digital Adoption Coordinator
EMAIL;TYPE=PREF,INTERNET:phearaneron.soeung@tsc.gov.kh
TEL;TYPE=CELL,VOICE:+855962021314
URL:https://pr0meth4us.github.io/egd/
REV:${new Date().toISOString()}
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Phearaneron_SOEUNG_EGD.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Show Toast
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    </script>

</body>
</html>
