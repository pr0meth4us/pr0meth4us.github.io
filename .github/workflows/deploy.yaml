name: Build and Deploy Site to Main Branch

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      deploy_choice:
        description: 'What to deploy'
        required: true
        default: 'Portfolio'
        type: choice
        options:
          - Portfolio
          - Status Page

concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deploy choice
        id: choice
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_CHOICE="${{ github.event.inputs.deploy_choice }}"
            echo "DEPLOY_CHOICE=$DEPLOY_CHOICE" >> $GITHUB_ENV
            echo "$DEPLOY_CHOICE" > /tmp/deploy_target.txt

            git fetch origin
            git checkout deploy-state || git checkout --orphan deploy-state
            git reset --hard
            git rm -rf . || true

            mv /tmp/deploy_target.txt ./deploy_target.txt

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add deploy_target.txt
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Set deploy target to $DEPLOY_CHOICE"
              git push -f origin deploy-state
            fi

            git checkout main
          else
            git fetch origin deploy-state
            git show origin/deploy-state:deploy_target.txt > deploy_target.txt
            DEPLOY_CHOICE=$(cat deploy_target.txt)
            echo "DEPLOY_CHOICE=$DEPLOY_CHOICE" >> $GITHUB_ENV
          fi

      - name: Debug deploy choice
        run: |
          echo "--------------------------------------------------"
          echo "Deploying choice: $DEPLOY_CHOICE"
          cat deploy_target.txt || echo "No deploy_target.txt found"
          echo "--------------------------------------------------"

      # -------------------
      # Portfolio pipeline
      # -------------------
      - name: Setup Ruby
        if: env.DEPLOY_CHOICE == 'Portfolio'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        if: env.DEPLOY_CHOICE == 'Portfolio'
        run: |
          gem install bundler
          bundle install --gemfile=Gemfile

      - name: Build Jekyll site
        if: env.DEPLOY_CHOICE == 'Portfolio'
        run: bundle exec jekyll build --config _config.yml --baseurl ""
        env:
          JEKYLL_ENV: production

      # -------------------
      # Deployment prep
      # -------------------
      - name: Prepare deployment directory
        run: |
          echo "Preparing to deploy: $DEPLOY_CHOICE"
          mkdir deploy_temp
          mkdir -p deploy_temp/.github/workflows
          cp .github/workflows/deploy.yaml deploy_temp/.github/workflows/deploy.yaml

          if [ "$DEPLOY_CHOICE" = "Portfolio" ]; then
            echo "Copying full Jekyll site from ./_site"
            rsync -av --delete --exclude='.github' ./_site/ deploy_temp/
          else
            echo "Copying status page from ./status_page"
            rsync -av --delete --exclude='.github' ./status_page/ deploy_temp/
          fi

          touch deploy_temp/.nojekyll
          echo "--------------------------------------------------"
          ls -R deploy_temp
          echo "--------------------------------------------------"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_temp
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Deploy: $DEPLOY_CHOICE to pages"
