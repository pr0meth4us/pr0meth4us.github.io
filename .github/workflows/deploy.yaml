# .github/workflows/deploy.yaml
# This entire file lives in your 'source' branch.

name: Build and Deploy Site to Main Branch

on:
  # This workflow runs automatically whenever you push to the 'source' branch.
  push:
    branches:
      - 'source'

# A single concurrent deployment is allowed, cancelling runs in progress.
concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Environment Variable to control deployment
    # EDIT THIS LINE: Change 'Portfolio' to 'Status Page' to deploy the other version.
    env:
      DEPLOY_CHOICE: 'Portfolio' 

    permissions:
      contents: write # Required to push to the main branch.

    steps:
      # Step 1: Checkout the source branch.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Build the Jekyll site (ONLY if "Portfolio" is chosen)
      # This section is now based on your proven workflow for reliability.
      - name: Setup Ruby
        if: env.DEPLOY_CHOICE == 'Portfolio'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Caches gems for faster builds.

      - name: Install dependencies
        if: env.DEPLOY_CHOICE == 'Portfolio'
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll site
        if: env.DEPLOY_CHOICE == 'Portfolio'
        run: bundle exec jekyll build --config _config.yml --baseurl ""
        env:
          JEKYLL_ENV: production

      # Step 3: Prepare the deployment directory based on the choice.
      - name: Prepare deployment directory
        run: |
          set -e
          echo "Preparing to deploy: ${{ env.DEPLOY_CHOICE }}"
          
          # Create a temporary directory for deployment files.
          mkdir deploy_temp
          
          # PRESERVATION FIRST: Copy the workflow file to ensure it's not deleted.
          echo "Preserving workflow file..."
          mkdir -p deploy_temp/.github/workflows
          cp .github/workflows/deploy.yaml deploy_temp/.github/workflows/deploy.yaml
          
          # Now, copy the correct site content into the temp directory.
          if [[ "${{ env.DEPLOY_CHOICE }}" == "Portfolio" ]]; then
            echo "Copying full Jekyll site from ./_site"
            rsync -av --delete ./_site/ deploy_temp/
          else
            echo "Copying status page from ./status_page"
            rsync -av --delete ./status_page/ deploy_temp/
          fi
          
          # Add the .nojekyll file.
          touch deploy_temp/.nojekyll
          
          # DEBUGGING: List the final contents of the deployment directory.
          echo "--------------------------------------------------"
          echo "Final contents of deploy_temp:"
          ls -R deploy_temp
          echo "--------------------------------------------------"

      # Step 4: Deploy the prepared files to the 'main' branch.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_temp
          publish_branch: main # DEPLOYMENT TARGET IS NOW 'main'
          force_orphan: true 
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Deploy: ${{ env.DEPLOY_CHOICE }} to pages"
