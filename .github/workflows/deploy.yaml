name: Deploy Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_choice:
        description: 'Choose what to deploy'
        required: true
        default: 'Portfolio'
        type: choice
        options:
          - 'Portfolio'
          - 'Status Page'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deploy choice
        id: deploy_choice
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHOICE="${{ github.event.inputs.deploy_choice }}"
          else
            # Default to Portfolio for push events
            CHOICE="Portfolio"
          fi
          echo "choice=$CHOICE" >> $GITHUB_OUTPUT
          echo "🚀 Deploy choice: $CHOICE"

      - name: Setup Ruby and Jekyll (Portfolio only)
        if: steps.deploy_choice.outputs.choice == 'Portfolio'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site (Portfolio only)
        if: steps.deploy_choice.outputs.choice == 'Portfolio'
        run: |
          echo "📦 Building Jekyll site..."
          echo "Ruby version: $(ruby --version)"
          echo "Bundler version: $(bundle --version)"
          echo "Available gems:"
          bundle list
          echo ""
          echo "Building site..."
          bundle exec jekyll build --verbose
          echo "✅ Jekyll build completed"

      - name: Clean up stale files (Status Page only)
        if: steps.deploy_choice.outputs.choice == 'Status Page'
        run: |
          echo "🧹 Cleaning up stale _site/ files..."
          if [ -d "_site" ]; then
            rm -rf _site/
            echo "✅ Removed existing _site/ directory"
          else
            echo "ℹ️ No _site/ directory found to clean"
          fi

      - name: Prepare deployment directory
        id: prepare
        run: |
          if [ "${{ steps.deploy_choice.outputs.choice }}" = "Portfolio" ]; then
            DEPLOY_DIR="_site"
          else
            DEPLOY_DIR="status_page"
          fi
          
          echo "deploy_dir=$DEPLOY_DIR" >> $GITHUB_OUTPUT
          echo "📁 Deployment directory: $DEPLOY_DIR"
          
          # Verify directory exists
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "❌ Error: Directory $DEPLOY_DIR does not exist!"
            exit 1
          fi
          
          echo "✅ Directory $DEPLOY_DIR exists and is ready for deployment"

      - name: Debug deployment contents
        run: |
          echo "🔍 Debug: Contents of deployment directory '${{ steps.prepare.outputs.deploy_dir }}':"
          ls -la "${{ steps.prepare.outputs.deploy_dir }}"
          echo ""
          echo "📊 File count in deployment directory:"
          find "${{ steps.prepare.outputs.deploy_dir }}" -type f | wc -l
          echo ""
          echo "💾 Total size of deployment directory:"
          du -sh "${{ steps.prepare.outputs.deploy_dir }}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.deploy_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Choice**: ${{ steps.deploy_choice.outputs.choice }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Directory**: \`${{ steps.prepare.outputs.deploy_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.deploy_choice.outputs.choice }}" = "Portfolio" ]; then
            echo "- **Jekyll Build**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Jekyll Build**: ⏭️ Skipped (Status Page deployment)" >> $GITHUB_STEP_SUMMARY
            echo "- **Cleanup**: ✅ Removed stale _site/ files" >> $GITHUB_STEP_SUMMARY
          fi
