<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status: Employed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter';
            background-color: #111827;
            color: #F3F4F6;
        }
        .font-mono {
            font-family: 'Source Code Pro', monospace;
        }
        .text-glow {
            text-shadow: 0 0 5px rgba(59, 130, 246, 0.5), 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .terminal-header {
            background-color: #374151;
        }
        .terminal-window {
            border: 1px solid #4B5563; /* border-gray-600 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: #34D399; /* bg-emerald-400 */
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: #34D399; }
        }
    </style>
</head>
<body class="antialiased">

<!-- Main Container -->
<div class="container mx-auto px-4 py-8 md:py-16 flex items-center justify-center min-h-screen">

    <!-- Terminal Window -->
    <div class="terminal-window max-w-2xl w-full mx-auto rounded-lg overflow-hidden">

        <!-- Terminal Header -->
        <div class="terminal-header flex items-center p-3">
            <div class="flex space-x-2">
                <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
                <div class="w-3 h-3 bg-green-500 rounded-full"></div>
            </div>
            <div class="flex-grow text-center text-sm font-mono text-gray-400">
                /dev/null - zsh
            </div>
        </div>

        <!-- Terminal Body -->
        <div id="terminal-body" class="bg-gray-800 p-6 md:p-8 font-mono text-base">

            <!-- Command Line Intro -->
            <div class="flex items-center">
                <span class="text-green-400">visitor@website:~$</span>
                <p class="flex-1 ml-2 text-gray-200" id="typewriter1"></p>
                <span class="cursor" id="cursor1"></span>
            </div>

            <!-- Status Content (hidden until typing is done) -->
            <div id="status-content" class="hidden mt-4 mb-6">
                <h2 class="text-xl md:text-2xl font-bold text-blue-400 text-glow">Status: Employed.</h2>
                <p class="mt-2 text-gray-300">
                    I'm not looking for a job anytime soon and am content with my current one. But you can find me here.
                </p>
            </div>
            <!-- NOTE: Contact content is now removed from here and will be generated by the script -->
        </div>
    </div>
</div>

<script>
    const terminalBody = document.getElementById('terminal-body');
    const typewriter1 = document.getElementById('typewriter1');
    const statusContent = document.getElementById('status-content');
    const cursor1 = document.getElementById('cursor1');

    const text1 = "cat /status.txt";
    const text2 = "cat /contact.info";
    let i = 0;
    let j = 0;

    // This function types the first command
    function typeWriter1() {
        if (i < text1.length) {
            typewriter1.innerHTML += text1.charAt(i);
            i++;
            setTimeout(typeWriter1, 120);
        } else {
            cursor1.style.display = 'none';
            statusContent.classList.remove('hidden');
            // Wait a bit before starting the second command
            setTimeout(initTypeWriter2, 1000);
        }
    }

    // This function creates the second command line and starts its typing animation
    function initTypeWriter2() {
        const commandLine2 = document.createElement('div');
        commandLine2.className = 'flex items-center';
        commandLine2.innerHTML = `
                <span class="text-green-400">visitor@website:~$</span>
                <p class="flex-1 ml-2 text-gray-200" id="typewriter2"></p>
                <span class="cursor" id="cursor2"></span>
            `;
        terminalBody.appendChild(commandLine2);
        typeWriter2();
    }

    // This function types the second command
    function typeWriter2() {
        const typewriter2 = document.getElementById('typewriter2');
        const cursor2 = document.getElementById('cursor2');
        if (j < text2.length) {
            typewriter2.innerHTML += text2.charAt(j);
            j++;
            setTimeout(typeWriter2, 120);
        } else {
            cursor2.style.display = 'none';
            // After typing is done, create and append the contact info
            showContactInfo();
        }
    }

    // This function creates and displays the contact info
    function showContactInfo() {
        const contactContent = document.createElement('div');
        contactContent.className = 'mt-4';
        contactContent.innerHTML = `
                <ul class="space-y-2 text-gray-300">
                    <li><span class="text-emerald-400 w-20 inline-block">email:</span> <a href="mailto:phearaneron.soeung@gmail.com" class="text-blue-400 hover:underline">phearaneron.soeung@gmail.com</a></li>
                    <li><span class="text-emerald-400 w-20 inline-block">phone:</span> <a href="tel:+855962021314" class="text-blue-400 hover:underline">+855 962021314</a></li>
                    <li><span class="text-emerald-400 w-20 inline-block">github:</span> <a href="https://github.com/pr0meth4us" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">pr0meth4us</a></li>
                    <li><span class="text-emerald-400 w-20 inline-block">linkedin:</span> <a href="https://linkedin.com/in/nernnnnnnn/" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">nernnnnnnn</a></li>
                    <li><span class="text-emerald-400 w-20 inline-block">telegram:</span> <a href="https://t.me/nernnnnnnn" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">@nernnnnnnn</a></li>
                    <li><span class="text-emerald-400 w-20 inline-block">spotify:</span> <a href="https://open.spotify.com/user/31xhd34ircry7yrq2bp4fobv3zqe?si=33176a8047084a1c" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline">31xhd34...</a></li>
                </ul>
                <p class="pt-6 text-gray-500 text-sm">// This page will self-destruct when my employment status changes. Or maybe not.</p>
            `;
        terminalBody.appendChild(contactContent);
    }

    // Start the effect on page load
    window.onload = function() {
        setTimeout(typeWriter1, 500); // Small delay to start
    };
</script>
</body>
</html>
