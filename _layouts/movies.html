---
layout: default
---
<div class="my-12 max-w-6xl mx-auto">
    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-800">Movie Log</h1>
        <p class="text-lg text-gray-600">A personal collection of films I've watched and my thoughts on them.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">
        {% for movie in site.data.movies %}
        <div class="group bg-white border rounded-lg shadow-sm overflow-hidden transform transition-all duration-300 hover:-translate-y-2 hover:shadow-xl">
            <div class="relative">
                <img src="{{ movie.poster }}" alt="Poster for {{ movie.title }}" class="w-full h-96 object-cover" loading="lazy">
                <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-60 transition-all duration-300 flex items-center justify-center">
                    <p class="text-white text-center p-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">
                        {{ movie.comment }}
                    </p>
                </div>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-lg text-gray-800 truncate">{{ movie.title }}</h3>
                <div class="flex justify-between items-center text-sm text-gray-500 mt-1">
                    <span>{{ movie.director }}</span>
                    <span class="font-semibold">{{ movie.year }}</span>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
